<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f7fa"><link rel="manifest" href="manifest.webmanifest"><title>北市勤務排程</title>
<style>
:root{--ink:#17243a;--muted:#758197;--line:#e6eaf0;--paper:#f5f7fa;--white:#fff;--blue:#315fce;--bluebg:#edf2ff;--teal:#178678;--amber:#ae7418;--red:#c45050;--shadow:0 8px 28px #2536540c}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}.shell{max-width:1420px;margin:auto;padding:24px 32px calc(40px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:12px}.mark{width:42px;height:42px;border-radius:13px;background:var(--blue);color:white;display:grid;place-items:center;font-size:21px;font-weight:900}.eyebrow{color:var(--muted);font-size:11px;letter-spacing:.1em}.title{font-size:20px;font-weight:850;letter-spacing:-.03em}.topright{display:flex;align-items:center;gap:10px}.datebox{padding:9px 13px;border:1px solid var(--line);border-radius:11px;background:white;font-weight:700;font-size:13px}.btn{display:inline-flex;align-items:center;justify-content:center;border:0;text-decoration:none;background:var(--blue);color:#fff;padding:10px 15px;border-radius:11px;font-weight:800;font-size:14px;cursor:pointer}.btn.secondary{background:white;color:var(--ink);border:1px solid var(--line)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:20px;align-items:start}.main{min-width:0}.welcome{display:flex;align-items:end;justify-content:space-between;margin:0 0 16px}.welcome h1{font-size:27px;letter-spacing:-.04em;margin:0}.welcome p{color:var(--muted);margin:5px 0 0}.sync{font-size:12px;color:var(--teal);font-weight:700;white-space:nowrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:15px}.stat,.panel,.day{background:white;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}.stat{padding:14px 17px;display:flex;align-items:center;justify-content:space-between}.stat span{color:var(--muted);font-size:12px;font-weight:700}.stat b{display:block;font-size:25px;letter-spacing:-.04em;margin-top:1px}.stat i{font-style:normal;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--bluebg);color:var(--blue)}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:10px}.search{flex:1;min-width:180px;position:relative}.search input{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 13px 10px 37px;background:#fff;color:var(--ink);font:inherit;outline:none}.search input:focus{border-color:#9aafea;box-shadow:0 0 0 3px #315fce12}.search span{position:absolute;left:13px;top:7px;color:#8d98a9;font-size:18px}.seg{display:flex;background:#e9edf3;border-radius:11px;padding:3px;flex-shrink:0}.seg button{border:0;background:transparent;color:#657187;font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;padding:7px 11px;border-radius:9px;cursor:pointer;white-space:nowrap}.seg button.active{background:white;color:var(--blue);box-shadow:0 1px 4px #26365018}.peoplebar{display:flex;gap:6px;overflow-x:auto;padding:1px 1px 10px;margin-bottom:2px;scrollbar-width:thin}.personfilter{border:1px solid var(--line);background:#fff;color:#59667a;border-radius:9px;padding:6px 10px;font:700 12px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;white-space:nowrap;cursor:pointer}.personfilter.active{background:var(--bluebg);color:var(--blue);border-color:#d8e2ff}.day{margin-bottom:12px;overflow:hidden}.dayhead{display:flex;justify-content:space-between;align-items:center;padding:13px 17px;background:#fbfcfe;border-bottom:1px solid var(--line)}.dayname{font-weight:850}.dayname small{font-weight:550;color:var(--muted);margin-left:7px}.dayname.today{color:var(--blue)}.count{color:var(--muted);font-size:12px;white-space:nowrap}.job{display:grid;grid-template-columns:62px minmax(0,1fr) minmax(110px,auto) 18px;align-items:center;gap:13px;padding:13px 17px;border-bottom:1px solid #eef1f5;cursor:pointer}.job:last-child{border-bottom:0}.job:hover,.job.open{background:#fbfcff}.time{font-size:15px;font-weight:850;font-variant-numeric:tabular-nums;color:#35435a}.jobmain{min-width:0}.customer{font-weight:800;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.task{font-size:12px;color:var(--muted);margin-top:3px}.badge{display:inline-block;margin-left:6px;padding:2px 7px;border-radius:6px;font-size:10px;font-weight:800;background:#fff4df;color:var(--amber)}.badge.red{background:#fff0ef;color:var(--red)}.crew{display:flex;justify-content:flex-end;gap:5px;flex-wrap:wrap}.person{padding:4px 8px;border-radius:7px;background:#eef3ff;color:#385aaf;font-weight:750;font-size:11px;white-space:nowrap}.person:nth-child(even){background:#eaf6f3;color:#24786b}.chev{color:#9aa4b3;font-size:19px;transition:transform .15s}.job.open .chev{transform:rotate(90deg)}.details{display:none;grid-column:1/-1;border-top:1px dashed var(--line);padding:10px 4px 2px 75px;color:#526078;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}.job.open .details{display:block}.detail-label{font-size:11px;color:var(--muted);font-weight:800;margin-bottom:3px}.side{position:sticky;top:18px}.panel{padding:16px;margin-bottom:13px}.panelhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}.panel h2{font-size:14px;margin:0}.textlink{font-size:12px;color:var(--blue);font-weight:750;cursor:pointer}.peoplelist{display:flex;flex-direction:column;gap:3px}.personrow{display:flex;align-items:center;gap:9px;padding:7px 5px;border-radius:9px;cursor:pointer}.personrow:hover,.personrow.selected{background:#f3f6fc}.avatar{width:30px;height:30px;display:grid;place-items:center;border-radius:9px;background:#eef3ff;color:#365ab3;font-size:12px;font-weight:850}.personname{flex:1;font-weight:700;font-size:12px}.number{font-size:11px;color:var(--muted)}.legend{display:grid;gap:9px;color:#667287;font-size:12px}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:8px;background:var(--blue)}.dot.amber{background:#dda93f}.dot.red{background:#d66767}.notice{padding:11px;border-radius:11px;background:#f3f7ff;color:#526988;font-size:11px}.state{background:#fff;border:1px solid var(--line);border-radius:15px;padding:28px 18px;text-align:center;color:var(--muted)}.state strong{display:block;color:var(--ink);font-size:15px;margin-bottom:5px}.hint{font-size:11px;color:#8993a3;margin:12px 2px}.error{color:var(--red)}@media(max-width:900px){.shell{padding:19px}.layout{grid-template-columns:1fr}.side{position:static;display:grid;grid-template-columns:1fr 1fr;gap:12px}.panel{margin:0}.side .panel:last-child{grid-column:1/-1}}@media(max-width:600px){.shell{padding:13px 11px calc(28px + env(safe-area-inset-bottom))}.top{align-items:center;margin-bottom:20px}.topright{gap:6px}.datebox{display:none}.btn{padding:9px 11px;font-size:12px}.title{font-size:17px}.mark{width:37px;height:37px}.welcome h1{font-size:23px}.welcome p{font-size:12px}.sync{font-size:10px}.stats{gap:7px}.stat{padding:11px 9px}.stat span{font-size:10px}.stat b{font-size:21px}.stat i{display:none}.toolbar{flex-wrap:wrap}.search{flex-basis:100%}.seg{width:100%;justify-content:space-between}.seg button{flex:1;padding:7px 4px;font-size:12px}.job{grid-template-columns:46px minmax(0,1fr) 16px;gap:8px;padding:12px 11px}.time{font-size:13px}.crew{grid-column:2;justify-content:flex-start;margin-top:4px}.chev{grid-column:3;grid-row:1}.jobmain{grid-column:2;grid-row:1}.details{padding-left:54px}.side{grid-template-columns:1fr}.side .panel:last-child{grid-column:auto}.dayhead{padding:11px 12px}.dayname{font-size:13px}.customer{font-size:13px}}
</style></head>
<body><div class="shell">
<header class="top"><div class="brand"><div class="mark">排</div><div><div class="eyebrow">FIELD OPERATIONS</div><div class="title">北市勤務排程</div></div></div><div class="topright"><div class="datebox" id="today"></div><a class="btn" href="admin.html">＋ 新增勤務</a></div></header>
<div class="layout"><main class="main"><div class="welcome"><div><h1>勤務總覽</h1><p>掌握今日安排與近期任務</p></div><div class="sync" id="sync">● 讀取中</div></div>
<section class="stats"><div class="stat"><div><span>符合條件勤務</span><b id="totalCount">—</b></div><i>▤</i></div><div class="stat"><div><span>出勤人員</span><b id="crewCount">—</b></div><i>♙</i></div><div class="stat"><div><span>未來 7 天勤務</span><b id="weekCount">—</b></div><i>◷</i></div></section>
<div class="toolbar"><label class="search"><span>⌕</span><input id="search" type="search" placeholder="搜尋客戶、工作內容、人員或備註" autocomplete="off"></label><div class="seg" id="tabs"><button class="active" data-view="all">全部</button><button data-view="today">今天</button><button data-view="week">7 天內</button><button data-view="future">後續</button></div></div><div class="peoplebar" id="peoplebar"></div><div id="list"><div class="state"><strong>正在載入勤務</strong>正在與排程資料同步…</div></div><div class="hint">點選勤務可展開備註與補充資料</div></main>
<aside class="side"><section class="panel"><div class="panelhead"><h2>人員勤務</h2><span class="textlink" id="clearPerson">清除篩選</span></div><div class="peoplelist" id="peoplelist"></div></section><section class="panel"><div class="panelhead"><h2>勤務類型</h2></div><div class="legend"><div><span class="dot"></span>一般勤務</div><div><span class="dot amber"></span>短租／例行</div><div><span class="dot red"></span>新開／增租／POC</div></div></section><section class="panel"><div class="notice">排程每分鐘自動同步；離線時會顯示上次載入的快取資料。</div></section></aside></div></div>
<script src="config.js"></script><script>
const CACHE_KEY='schedule-cache-v1';const STAFF=['文豪','耀文','保鈞','恒諄','恆諄','財哥'];let DATA=[];let currentView='all';let currentPerson='';let lastSync=null;const $=id=>document.getElementById(id);const WEEK=['日','一','二','三','四','五','六'];const today=new Date();today.setHours(0,0,0,0);$('today').textContent=`${today.getFullYear()} 年 ${today.getMonth()+1} 月 ${today.getDate()} 日・週${WEEK[today.getDay()]}`;
try{const cached=localStorage.getItem(CACHE_KEY);if(cached)DATA=JSON.parse(cached)}catch{}
function parseDate(s){const m=String(s||'').match(/(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/);if(!m)return null;const d=new Date(+m[1],+m[2]-1,+m[3]);d.setHours(0,0,0,0);return d}function daysAway(s){const d=parseDate(s);return d?Math.round((d-today)/86400000):99999}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function tagClass(t){return t==='短租'||t==='例行'?'badge':/新開|增租|POC/.test(t||'')?'badge red':''}function jobText(x){return [x.date,x.time,x.customer,x.task,(x.people||[]).join(' '),x.note1||x.note,x.note2,x.note3].join(' ').toLowerCase()}
function filtered(){const q=$('search').value.trim().toLowerCase();return DATA.filter(x=>{const n=daysAway(x.date);const view=currentView==='all'||(currentView==='today'&&n===0)||(currentView==='week'&&n>=0&&n<=7)||(currentView==='future'&&n>7);return view&&(!currentPerson||(x.people||[]).includes(currentPerson))&&(!q||jobText(x).includes(q))})}
function details(x){const fields=[['備註',x.note1||x.note],['備註 2',x.note2],['備註 3',x.note3]].filter(([,v])=>v);return fields.length?`<div class="details">${fields.map(([k,v])=>`<div class="detail-label">${k}</div><div>${esc(v)}</div>`).join('')}</div>`:''}
function render(){const result=filtered();$('totalCount').textContent=result.length;const activePeople=new Set(result.flatMap(x=>x.people||[]));$('crewCount').textContent=activePeople.size;$('weekCount').textContent=DATA.filter(x=>daysAway(x.date)>=0&&daysAway(x.date)<=7).length;const groups={};result.forEach(x=>{const k=x.date||'未定日期';(groups[k]??=[]).push(x)});const keys=Object.keys(groups);$('list').innerHTML=keys.length?keys.map(k=>{const d=parseDate(k),n=daysAway(k);let label=n===0?'今天':n===1?'明天':k;let sub=d?`${d.getMonth()+1} 月 ${d.getDate()} 日・週${WEEK[d.getDay()]}`:'';const jobs=groups[k].map(x=>{const people=(x.people||[]).map(p=>`<span class="person">${esc(p)}</span>`).join('');const badge=x.task?`<span class="${tagClass(x.task)}">${esc(x.task)}</span>`:'';return `<article class="job" tabindex="0" aria-expanded="false"><div class="time">${esc(x.time||'未定')}</div><div class="jobmain"><div class="customer">${esc(x.customer||'未填客戶')}</div><div class="task">${badge}</div></div><div class="crew">${people}</div><div class="chev">›</div>${details(x)}</article>`}).join('');return `<section class="day"><div class="dayhead"><div class="dayname ${n===0?'today':''}">${esc(label)} <small>${esc(sub)}</small></div><div class="count">${groups[k].length} 筆勤務</div></div>${jobs}</section>`}).join(''):`<div class="state"><strong>沒有符合條件的勤務</strong>試試其他日期、人員或搜尋字詞</div>`;document.querySelectorAll('.job').forEach(el=>{const toggle=()=>{el.classList.toggle('open');el.setAttribute('aria-expanded',el.classList.contains('open'))};el.addEventListener('click',toggle);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}})});renderPeople()}
function renderPeople(){const counts={};DATA.forEach(x=>(x.people||[]).forEach(p=>counts[p]=(counts[p]||0)+1));const people=[...new Set([...STAFF,...Object.keys(counts)])];$('peoplebar').innerHTML=`<button class="personfilter ${currentPerson?'':'active'}" data-person="">全部人員</button>`+people.map(p=>`<button class="personfilter ${currentPerson===p?'active':''}" data-person="${esc(p)}">${esc(p)}</button>`).join('');$('peoplelist').innerHTML=people.map(p=>`<div class="personrow ${currentPerson===p?'selected':''}" data-person="${esc(p)}"><span class="avatar">${esc(p.slice(0,1))}</span><span class="personname">${esc(p)}</span><span class="number">${counts[p]||0} 筆</span></div>`).join('');document.querySelectorAll('[data-person]').forEach(el=>el.onclick=()=>{currentPerson=el.dataset.person;render()})}
async function load(){if(!window.SCHEDULE_API_URL){$('sync').textContent='● 尚未設定 API';$('sync').classList.add('error');$('list').innerHTML='<div class="state"><strong>尚未設定資料來源</strong>請在 config.js 設定 Apps Script 網址</div>';return}try{const r=await fetch(window.SCHEDULE_API_URL+'?action=list&t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(`伺服器回應 ${r.status}`);const j=await r.json();if(!j.ok)throw Error(j.error||'讀取失敗');DATA=j.data||[];localStorage.setItem(CACHE_KEY,JSON.stringify(DATA));lastSync=new Date();$('sync').textContent=`● 已同步 ${lastSync.toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})}`;$('sync').classList.remove('error');render()}catch(e){$('sync').textContent=DATA.length?'● 離線・顯示快取':'● 同步失敗';$('sync').classList.add('error');if(DATA.length)render();else $('list').innerHTML=`<div class="state"><strong>無法讀取排程</strong>${esc(e.message)}</div>`}}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentView=b.dataset.view;render()});$('search').addEventListener('input',render);$('clearPerson').onclick=()=>{currentPerson='';render()};if(DATA.length)render();load();setInterval(load,60000);
</script></body></html>
