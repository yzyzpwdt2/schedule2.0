<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f7fa"><title>北市勤務排程｜新增勤務</title>
<style>
:root{--ink:#17243a;--muted:#758197;--line:#e6eaf0;--paper:#f5f7fa;--blue:#315fce;--bluebg:#edf2ff;--red:#c45050;--shadow:0 8px 28px #2536540c}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}.shell{max-width:1320px;margin:auto;padding:24px 32px calc(40px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px}.mark{width:42px;height:42px;border-radius:13px;background:#315fce;color:white;display:grid;place-items:center;font-size:21px;font-weight:900}.eyebrow{font-size:11px;color:var(--muted);letter-spacing:.1em}.title{font-size:20px;font-weight:850}.link{color:#315fce;text-decoration:none;font-size:13px;font-weight:750}.layout{display:grid;grid-template-columns:minmax(340px,410px) minmax(0,1fr);gap:19px;align-items:start}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}.panelhead{margin-bottom:17px}.panelhead h1,.panelhead h2{font-size:18px;margin:0}.panelhead p{color:var(--muted);font-size:12px;margin:4px 0 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{min-width:0}.full{grid-column:1/-1}.field label,.legend{display:block;color:#59667a;font-size:12px;font-weight:750;margin-bottom:6px}.input,textarea{width:100%;border:1px solid #dfe4ec;border-radius:10px;background:white;color:var(--ink);padding:10px 11px;font:inherit;outline:none}.input:focus,textarea:focus{border-color:#92a9e9;box-shadow:0 0 0 3px #315fce13}textarea{min-height:92px;resize:vertical}.people{display:flex;flex-wrap:wrap;gap:7px}.pc{display:inline-flex;align-items:center;gap:6px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:#536176;font-size:12px;font-weight:750;cursor:pointer}.pc:has(input:checked){background:var(--bluebg);border-color:#d4defb;color:#315fce}.pc input{accent-color:#315fce;margin:0}.save{width:100%;margin-top:15px;border:0;border-radius:10px;background:#315fce;color:white;padding:11px 14px;font:800 14px inherit;cursor:pointer}.save:disabled{opacity:.65;cursor:wait}.status{min-height:20px;margin-top:9px;color:#178678;font-size:12px}.status.error{color:var(--red)}.listhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.listhead h2{font-size:16px;margin:0}.listtools{display:flex;gap:7px}.search{width:min(250px,40vw);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:13px inherit}.refresh{border:1px solid var(--line);background:white;border-radius:9px;padding:7px 10px;font-weight:750;color:#506078;cursor:pointer}.list{max-height:calc(100vh - 190px);min-height:200px;overflow:auto}.row{display:grid;grid-template-columns:93px 62px minmax(120px,1fr) 95px minmax(90px,130px);gap:10px;align-items:start;padding:12px 6px;border-bottom:1px solid #edf0f4;font-size:12px}.rowhead{position:sticky;top:0;background:#fbfcfe;color:var(--muted);font-size:11px;font-weight:800;padding-top:9px;padding-bottom:9px}.muted{color:var(--muted);font-size:11px;margin-top:3px;white-space:pre-wrap}.empty{padding:26px 12px;text-align:center;color:var(--muted);font-size:13px}@media(max-width:900px){.shell{padding:19px}.layout{grid-template-columns:1fr}.list{max-height:520px}}@media(max-width:600px){.shell{padding:13px 11px}.top{margin-bottom:17px}.mark{width:37px;height:37px}.title{font-size:17px}.panel{padding:15px}.listhead{align-items:flex-start;flex-direction:column}.listtools{width:100%}.search{width:100%;flex:1}.row{grid-template-columns:68px 48px minmax(100px,1fr);gap:7px;padding:10px 3px}.row>:nth-child(4){grid-column:3}.row>:nth-child(5){grid-column:3}.rowhead{display:none}}
</style></head><body><div class="shell"><header class="top"><div class="brand"><div class="mark">排</div><div><div class="eyebrow">FIELD OPERATIONS</div><div class="title">北市勤務排程</div></div></div><a class="link" href="./">← 回勤務總覽</a></header><div class="layout"><section class="panel"><div class="panelhead"><h1>新增勤務</h1><p>填寫勤務資料後新增至共用排程</p></div><form id="form"><div class="grid"><div class="field"><label for="date">日期 *</label><input class="input" id="date" type="date" required></div><div class="field"><label for="time">時間</label><input class="input" id="time" type="time"></div><div class="field full"><label for="customer">客戶／地點 *</label><input class="input" id="customer" maxlength="120" required placeholder="例如：宏達電子・內湖廠"></div><div class="field full"><label for="task">工作內容 *</label><input class="input" id="task" maxlength="120" required placeholder="例如：設備巡檢"></div><div class="field full"><span class="legend">工程師</span><div class="people"><label class="pc"><input type="checkbox" name="people" value="文豪">文豪</label><label class="pc"><input type="checkbox" name="people" value="耀文">耀文</label><label class="pc"><input type="checkbox" name="people" value="保鈞">保鈞</label><label class="pc"><input type="checkbox" name="people" value="恒諄">恒諄</label><label class="pc"><input type="checkbox" name="people" value="財哥">財哥</label></div></div><div class="field full"><label for="note">備註</label><textarea class="input" id="note" maxlength="2000" placeholder="地址、聯絡方式或工作提醒"></textarea></div></div><button class="save" id="submit" type="submit">新增至排程</button><div class="status" id="status" role="status" aria-live="polite"></div></form></section><section class="panel"><div class="listhead"><div><h2>近期排程</h2><div class="muted" id="listStatus">載入中…</div></div><div class="listtools"><input class="search" id="filter" type="search" placeholder="搜尋排程"><button class="refresh" id="refresh" type="button">重新整理</button></div></div><div class="list" id="list"></div></section></div></div>
<script src="config.js"></script><script>
const $=id=>document.getElementById(id);const form=$('form');const names=['文豪','耀文','保鈞','恒諄','財哥'];let rows=[];function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function renderList(){const q=$('filter').value.trim().toLowerCase();const shown=rows.filter(x=>[x.date,x.time,x.customer,x.task,(x.people||[]).join(' '),x.note].join(' ').toLowerCase().includes(q));$('listStatus').textContent=`${shown.length} 筆勤務`;const body=shown.map(x=>`<div class="row"><div>${esc(x.date)}</div><div>${esc(x.time)}</div><div><strong>${esc(x.customer)}</strong><div class="muted">${esc(x.note)}</div></div><div>${esc(x.task)}</div><div>${esc((x.people||[]).join('／'))}</div></div>`).join('');$('list').innerHTML=`<div class="row rowhead"><div>日期</div><div>時間</div><div>客戶／備註</div><div>工作內容</div><div>工程師</div></div>${body||'<div class="empty">沒有符合條件的勤務</div>'}`}
async function loadList(){if(!window.SCHEDULE_API_URL){$('listStatus').textContent='尚未設定 API';return} $('listStatus').textContent='正在同步…';try{const r=await fetch(window.SCHEDULE_API_URL+'?action=list&t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(`伺服器回應 ${r.status}`);const j=await r.json();if(!j.ok)throw Error(j.error||'讀取失敗');rows=j.data||[];renderList()}catch(e){$('listStatus').textContent='讀取失敗：'+e.message;$('list').innerHTML='<div class="empty">暫時無法讀取近期排程</div>'}}
function localDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`} $('date').value=localDate(new Date());$('filter').addEventListener('input',renderList);$('refresh').onclick=loadList;
form.onsubmit=async e=>{e.preventDefault();const status=$('status'),button=$('submit');if(!window.SCHEDULE_API_URL){status.textContent='尚未設定資料來源，請先在 config.js 設定 Apps Script 網址';status.className='status error';return}const body={action:'add',date:$('date').value,time:$('time').value,customer:$('customer').value.trim(),task:$('task').value.trim(),people:[...document.querySelectorAll('input[name="people"]:checked')].map(x=>x.value),note:$('note').value.trim()};if(!body.customer||!body.task){status.textContent='請填寫客戶／地點與工作內容';status.className='status error';return}button.disabled=true;button.textContent='新增中…';status.textContent='正在寫入共用排程…';status.className='status';try{const r=await fetch(window.SCHEDULE_API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});if(!r.ok)throw Error(`伺服器回應 ${r.status}`);const j=await r.json();if(!j.ok)throw Error(j.error||'寫入失敗');status.textContent='已成功新增勤務';form.reset();$('date').value=localDate(new Date());await loadList()}catch(err){status.textContent='新增失敗：'+err.message;status.className='status error'}finally{button.disabled=false;button.textContent='新增至排程'}};loadList();
</script></body></html>
